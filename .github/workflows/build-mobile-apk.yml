name: Build Mobile APK (Universal & Splits)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      target_abis:
        description: 'Target ABIs (comma-separated, e.g. arm64-v8a or arm64-v8a,armeabi-v7a)'
        required: true
        default: 'arm64-v8a'
        type: string

permissions:
  contents: read

jobs:
  build-mobile-apk:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Keystore for Release
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -genkey -v -keystore vz-pixelplay.jks -alias pixelplay-key -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass pixelplaypass -keypass pixelplaypass \
            -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"
          echo "storePassword=pixelplaypass" > keystore.properties
          echo "keyAlias=pixelplay-key" >> keystore.properties
          echo "keyPassword=pixelplaypass" >> keystore.properties

      - name: Build Debug APKs (Universal + ABI Splits)
        if: (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '') && !startsWith(github.ref, 'refs/tags/v')
        run: |
          TARGET_ABIS="${{ github.event.inputs.target_abis || 'arm64-v8a' }}"
          ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=false
          ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=true -Ppixelplay.targetAbis="$TARGET_ABIS"

      - name: Build Release APKs (Universal + ABI Splits)
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TARGET_ABIS="${{ github.event.inputs.target_abis || 'arm64-v8a' }}"
          ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=false --stacktrace --info
          ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true -Ppixelplay.targetAbis="$TARGET_ABIS" --stacktrace --info

      - name: Verify APK Signatures
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          find app/build/outputs/apk/ -type f -name "*.apk" | while read -r apk; do
            echo "Verifying $apk..."
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk" || true
          done

      - name: Upload Debug APK Artifacts
        if: (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '') && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlayer-Debug-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifacts
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlayer-Release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
